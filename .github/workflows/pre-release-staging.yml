name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: "UE ScooterUtils"
      project_context: "UE ScooterUtils is an Unreal Engine utility plugin for game developers and technical artists. It adds productivity tools, editor utilities, and workflow helpers to Unreal Engine projects. Changes affect how developers work in the editor — write in terms of workflow improvements, time saved, or friction eliminated."
      header: |
        ## UE ScooterUtils

        > Unreal Engine utility plugin for developers and technical artists.

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://www.scottkirvan.com/ScooterUtils/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/ScooterUtils/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/ScooterUtils/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/ScooterUtils/blob/main/notes/CHANGELOG.md)

        ---
    secrets: inherit
