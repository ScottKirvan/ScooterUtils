name: Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      packed_version: ${{ steps.packed.outputs.value }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

      # The .uplugin "Version" must be an increasing integer, which release-please
      # can't write (its JSON updater only writes the version string, used for
      # VersionName). Pack major.minor.patch into one, e.g. 1.10.10 -> 1010010.
      - name: Compute packed plugin version
        id: packed
        if: ${{ steps.release.outputs.release_created }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
          PATCH: ${{ steps.release.outputs.patch }}
        run: |
          VALUE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "Packed version: $VALUE"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

  apply-staged-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      used_staging: ${{ steps.apply.outputs.used_staging }}
      discord_blurb: ${{ steps.apply.outputs.discord_blurb }}
    steps:
      - name: Apply staged notes and clean up
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          STAGING_BRANCH="pre-release-staging/$TAG"

          if ! gh api "repos/$REPO/branches/$STAGING_BRANCH" > /dev/null 2>&1; then
            echo "used_staging=false" >> "$GITHUB_OUTPUT"
            echo "No staging branch found for $TAG — will fall back to AI generation"
            exit 0
          fi

          echo "Found staging branch: $STAGING_BRANCH"

          NOTES=$(gh api "repos/$REPO/contents/.github/tmp/pre-release-staging/release-notes.md?ref=$STAGING_BRANCH" \
            --jq '.content' | base64 -d)
          BLURB=$(gh api "repos/$REPO/contents/.github/tmp/pre-release-staging/discord-blurb.txt?ref=$STAGING_BRANCH" \
            --jq '.content' | base64 -d 2>/dev/null || echo "")

          printf '%s' "$NOTES" > /tmp/staged-release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/staged-release-notes.md
          echo "Applied staged release notes to $TAG"

          gh api "repos/$REPO/git/refs/heads/$STAGING_BRANCH" --method DELETE || true
          echo "Deleted staging branch: $STAGING_BRANCH"

          echo "used_staging=true" >> "$GITHUB_OUTPUT"
          { echo 'discord_blurb<<BLURB_EOF'
            printf '%s\n' "$BLURB"
            echo 'BLURB_EOF'
          } >> "$GITHUB_OUTPUT"

  improve-release-notes:
    needs: [release-please, apply-staged-notes]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.apply-staged-notes.outputs.used_staging == 'false'
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "UE ScooterUtils"
      project_context: "UE ScooterUtils is an Unreal Engine utility plugin for game developers and technical artists. It adds productivity tools, editor utilities, and workflow helpers to Unreal Engine projects. Changes affect how developers work in the editor — write in terms of workflow improvements, time saved, or friction eliminated."
      header: |
        ## UE ScooterUtils

        > Unreal Engine utility plugin for developers and technical artists.

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://www.scottkirvan.com/ScooterUtils/guide/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/ScooterUtils/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/ScooterUtils/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/ScooterUtils/blob/main/notes/CHANGELOG.md)

        ---
      footer: ""
      changelog_path: "notes/CHANGELOG.md"
    secrets: inherit

  build-plugin:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: [self-hosted, windows, unreal]
    strategy:
      matrix:
        ue_version: ['5.4', '5.5', '5.6', '5.7', '5.8']
      fail-fast: false
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4

      # BuildPlugin re-saves the descriptor without touching "Version", so the
      # packaged plugin only gets the right one if it's set here first.
      - name: Set .uplugin Version to ${{ needs.release-please.outputs.packed_version }}
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PACKED_VERSION: ${{ needs.release-please.outputs.packed_version }}
        run: |
          $path = "${{ github.workspace }}\ScooterUtils.uplugin"
          $text = [IO.File]::ReadAllText($path)
          $updated = [regex]::Replace($text, '"Version":\s*\d+', "`"Version`": $env:PACKED_VERSION")
          if ($updated -notmatch "`"Version`": $env:PACKED_VERSION\b") { Write-Error "Failed to set Version in $path"; exit 1 }
          [IO.File]::WriteAllText($path, $updated, (New-Object System.Text.UTF8Encoding $false))
          Select-String -Path $path -Pattern '"Version(Name)?"'

      - name: Build plugin for UE ${{ matrix.ue_version }}
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $UAT = "D:\bin\Epic Games\UE_${{ matrix.ue_version }}\Engine\Build\BatchFiles\RunUAT.bat"
          $plugin = "${{ github.workspace }}\ScooterUtils.uplugin"
          $output = "${{ github.workspace }}\build\UE_${{ matrix.ue_version }}"
          & $UAT BuildPlugin -Plugin="$plugin" -Package="$output" -Rocket -TargetPlatforms=Win64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean build output
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $intermediate = "build\UE_${{ matrix.ue_version }}\Intermediate"
          if (Test-Path $intermediate) {
            Remove-Item -Recurse -Force $intermediate
            Write-Host "Removed Intermediate folder"
          }

      - name: Package artifact
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $zipName = "ScooterUtils-UE${{ matrix.ue_version }}-Win64.zip"
          Compress-Archive -Path "build\UE_${{ matrix.ue_version }}\*" -DestinationPath $zipName
          Write-Host "Created: $zipName"

      - name: Upload to release
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "ScooterUtils-UE${{ matrix.ue_version }}-Win64.zip" --clobber

  # Keeps the repo's .uplugin "Version" in step with VersionName. Runs after the
  # release commit is on main, so there's no release-please branch to race
  # (pushing to release-please's PR branch is what #136 was about). A
  # GITHUB_TOKEN push doesn't trigger this workflow again.
  commit-uplugin-version:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit .uplugin Version
        env:
          PACKED_VERSION: ${{ needs.release-please.outputs.packed_version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          sed -i -E "s/\"Version\":[[:space:]]*[0-9]+/\"Version\": $PACKED_VERSION/" ScooterUtils.uplugin
          grep -E '"Version(Name)?"' ScooterUtils.uplugin
          if git diff --quiet -- ScooterUtils.uplugin; then
            echo "ScooterUtils.uplugin already at Version $PACKED_VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: set .uplugin Version to $PACKED_VERSION for $TAG" -- ScooterUtils.uplugin
          # update-changelog-prs pushes to main around the same time; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt), rebasing onto main"
            sleep $((attempt * 3))
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Rebasing the .uplugin Version commit onto main failed"
              exit 1
            fi
          done
          echo "::error::Could not push the .uplugin Version update to main"
          exit 1

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  discord-notify:
    needs: [release-please, apply-staged-notes, improve-release-notes, build-plugin]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      !failure() && !cancelled()
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "UE ScooterUtils"
      emoji: "🛵"
      discord_blurb: ${{ needs.apply-staged-notes.outputs.discord_blurb || needs.improve-release-notes.outputs.discord_blurb }}
    secrets: inherit
